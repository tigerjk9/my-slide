<!doctype html>
<html lang="ko">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>마무리와 질문</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Noto+Sans+KR:wght@400;500;700&family=Noto+Serif+KR:wght@500;700;900&display=swap" rel="stylesheet">
<link rel="stylesheet" href="../assets/slide-theme.css">
<style>
  .close .title { max-width: 820px; }
  .close .lead  { max-width: 720px; }
  .close .cols  { display: grid; grid-template-columns: 400px 360px; column-gap: 64px; margin-top: 40px; }
  .close .cols h3 { font: 700 14px/1 var(--font-body); letter-spacing: .18em; color: var(--clay); }
  .close .cols p  { margin-top: 12px; font-size: 17px; line-height: 1.65; color: var(--ink-soft); }
  .close .shelf  { top: 586px; }
  .close .spines { right: 88px; top: 426px; width: 230px; height: 160px; }
  .close .meta { position: absolute; left: 88px; top: 616px; font: 700 16px/1.4 var(--font-display); color: var(--ink); }
  .close .meta span { margin: 0 8px; color: var(--ink-soft); }
</style>
</head>
<body class="slide-preview">
<section class="slide close" data-title="마무리와 질문">
  <p class="kicker">마무리</p>
  <h2 class="title">오늘 정한 약속은 두 가지입니다</h2>
  <p class="lead">교실에서 매일 아침 10분, 집에서 잠들기 전 15분.<br>책 고르기는 아이에게 맡깁니다.</p>

  <div class="cols">
    <div>
      <h3>질문과 의견</h3>
      <p>지금 바로 질문해 주셔도 좋고, 설명회가 끝난 뒤에는 알림장이나 학급 소통방으로 보내 주셔도 됩니다.</p>
    </div>
    <div>
      <h3>다음 안내</h3>
      <p>독서 기록장은 매달 마지막 주에 가정으로 보냅니다. 한 줄 확인만 부탁드립니다. 집에서 다 읽은 책을 학급 문고에 보내 주시면 한 달 동안 친구들과 나눠 읽습니다.</p>
    </div>
  </div>

  <svg class="spines" viewBox="0 0 420 292" aria-hidden="true" focusable="false">
    <rect x="18"  y="64" width="48" height="228" fill="#2e5c49"/>
    <rect x="72"  y="36" width="40" height="256" fill="#c2573b"/>
    <rect x="118" y="92" width="58" height="200" fill="#1f2e2a"/>
    <rect x="182" y="54" width="34" height="238" fill="#dfae55"/>
    <rect x="222" y="80" width="50" height="212" fill="#2e5c49"/>
    <polygon points="286,292 324,292 360,78 322,78" fill="#1f2e2a"/>
    <rect x="18"  y="80"  width="48" height="3" fill="rgba(246,241,230,.55)"/>
    <rect x="18"  y="270" width="48" height="3" fill="rgba(246,241,230,.55)"/>
    <rect x="72"  y="54"  width="40" height="3" fill="rgba(246,241,230,.55)"/>
    <rect x="118" y="108" width="58" height="3" fill="rgba(246,241,230,.4)"/>
    <rect x="118" y="270" width="58" height="3" fill="rgba(246,241,230,.4)"/>
    <rect x="182" y="70"  width="34" height="3" fill="rgba(31,46,42,.35)"/>
    <rect x="222" y="96"  width="50" height="3" fill="rgba(246,241,230,.55)"/>
    <rect x="36"  y="110" width="12" height="120" fill="rgba(246,241,230,.28)"/>
    <rect x="138" y="140" width="18" height="100" fill="rgba(246,241,230,.22)"/>
    <rect x="96"  y="14"  width="8"  height="34"  fill="#dfae55"/>
  </svg>
  <div class="shelf"></div>

  <p class="meta">{{presenter}}<span>·</span>{{date}}</p>
</section>
</body>
</html>
